<h1 class="section-title">

<p>

</p>
<br>
<form id="loginForm">
<label>

パスワード

</label>

ログイン

</button>
</form>
<p
id="loginError"
style="
margin-top:20px;

">

パスワードが違います。

</p>

<footer id="footer"></footer>
<script src="assets/js/common.js"></script>
<script>
const loginForm =
    document.getElementById("loginForm");
const passwordInput =
    document.getElementById("password");
const loginError =
    document.getElementById("loginError");
loginForm.addEventListener(
    "submit",
    function(event){
        event.preventDefault();
        const password =
            passwordInput.value;
        if(password === "112233"){
            sessionStorage.setItem(
                "adminLoggedIn",
                "true"
            );
            location.href =
                "admin.html";
        }else{
            loginError.style.display =
                "block";
            passwordInput.value = "";
            passwordInput.focus();
        }
    }
);
</script>
