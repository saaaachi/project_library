<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>
<title>
管理画面 | Project Library
</title>
<!-- ======================================
     管理画面ログイン確認
     ====================================== -->
<script>
if(
    sessionStorage.getItem("adminLoggedIn")
    !==
    "true"
){
    location.href =
        "admin-login.html";
}
function logout(){
    sessionStorage.removeItem(
        "adminLoggedIn"
    );
    location.href =
        "admin-login.html";
}
</script>
<!-- ======================================
     共通CSS
     ====================================== -->
<link
    rel="stylesheet"
    href="assets/css/style.css"
>
</head>
<body>
<!-- ======================================
     ヘッダー
     ====================================== -->
<header id="header"></header>
<!-- ======================================
     サイドバー
     ====================================== -->
<div id="sidebar"></div>
<!-- ======================================
     メイン
     ====================================== -->
<main class="admin-container">
<!-- ======================================
     タイトル・ログアウト
     ====================================== -->
<div
    style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:20px;
        flex-wrap:wrap;
    "
>
    <div>
        <h1>
            📚 Project Library 管理画面
        </h1>
        <p class="admin-subtitle">
            作品登録・編集・管理を行います
        </p>
    </div>
    <button
        type="button"
        onclick="logout()"
    >
        ログアウト
    </button>
</div>
<!-- ======================================
     作品登録フォーム
     ====================================== -->
<form
    id="workForm"
>
<!-- ======================================
     タイトル
     ====================================== -->
<div class="admin-form-item">
    <label
        for="title"
    >
        タイトル
    </label>
    <input
        type="text"
        id="title"
        name="title"
        placeholder="作品タイトルを入力"
        required
    >
</div>
<!-- ======================================
     PDF
     ====================================== -->
<div class="admin-form-item">
    <label
        for="pdfFile"
    >
        PDFファイル
    </label>
    <input
        type="file"
        id="pdfFile"
        name="pdfFile"
        accept=".pdf,application/pdf"
    >
    <p
        style="
            margin:8px 0 0;
            font-size:13px;
            color:#777;
            line-height:1.6;
        "
    >
        PDFを選択すると1ページ目からサムネイルを自動作成します。
    </p>
</div>
<!-- ======================================
     サムネイルプレビュー
     ====================================== -->
<div class="admin-form-item">
    <label>
        サムネイル
    </label>
    <div
        class="preview-box"
        style="
            max-width:220px;
        "
    >
        <div
            class="thumbnail-preview"
            id="thumbnailPreview"
        >
            PDFを選択すると表示されます
        </div>
    </div>
</div>
<!-- ======================================
     カテゴリ
     ====================================== -->
<div class="admin-form-item">
    <label>
        カテゴリ
    </label>
    <div class="check-group">
        <label>
            <input
                type="checkbox"
                value="幼児向け"
                data-category
            >
            幼児向け
        </label>
        <label>
            <input
                type="checkbox"
                value="子ども向け"
                data-category
            >
            子ども向け
        </label>
        <label>
            <input
                type="checkbox"
                value="大人向け"
                data-category
            >
            大人向け
        </label>
        <label>
            <input
                type="checkbox"
                value="シニア・リハビリ"
                data-category
            >
            シニア・リハビリ
        </label>
    </div>
    <p
        style="
            margin:8px 0 0;
            font-size:13px;
            color:#777;
        "
    >
        複数選択できます。
    </p>
</div>
<!-- ======================================
     固定タグ
     ====================================== -->
<div class="admin-form-item">
    <label>
        固定タグ
    </label>
    <div
        id="fixedTagChoices"
        class="tag-choice-group"
    ></div>
    <input
        type="text"
        id="fixedTags"
        name="fixedTags"
        placeholder="新しい固定タグを入力（複数はカンマ区切り）"
    >
</div>
<!-- ======================================
     自由タグ
     ====================================== -->
<div class="admin-form-item">
    <label>
        自由タグ
    </label>
    <div
        id="freeTagChoices"
        class="tag-choice-group"
    ></div>
    <input
        type="text"
        id="freeTags"
        name="freeTags"
        placeholder="新しい自由タグを入力（複数はカンマ区切り）"
    >
</div>
<!-- ======================================
     シリーズ
     ====================================== -->
<div class="admin-form-item">
    <label>
        シリーズ
    </label>
    <div
        id="seriesChoices"
        class="tag-choice-group"
    ></div>
    <input
        type="text"
        id="series"
        name="series"
        placeholder="新しいシリーズ名を入力"
    >
</div>
<!-- ======================================
     難易度
     ====================================== -->
<div class="admin-form-item">
    <label
        for="difficulty"
    >
        難易度
    </label>
    <select
        id="difficulty"
        name="difficulty"
    >
        <option value="1">
            ★☆☆ 初級
        </option>
        <option value="2">
            ★★☆ 中級
        </option>
        <option value="3">
            ★★★ 上級
        </option>
    </select>
</div>
<!-- ======================================
     印刷サイズ
     ====================================== -->
<div class="admin-form-item">
    <label
        for="size"
    >
        印刷サイズ
    </label>
    <select
        id="size"
        name="size"
    >
        <option value="A4">
            A4
        </option>
        <option value="A3">
            A3
        </option>
    </select>
</div>
<!-- ======================================
     説明
     ====================================== -->
<div class="admin-form-item">
    <label
        for="description"
    >
        説明
    </label>
    <textarea
        id="description"
        name="description"
        rows="6"
        placeholder="作品の説明を入力してください"
    ></textarea>
</div>
<!-- ======================================
     編集ID
     ====================================== -->
<input
    type="hidden"
    id="editId"
    name="editId"
>
</form>
<!-- ======================================
     下部操作ボタン
     ====================================== -->
<div class="admin-bottom-bar">
    <button
        type="button"
        class="draft"
    >
        下書き保存
    </button>
    <button
        type="button"
        class="publish"
    >
        🚀 公開する
    </button>
</div>
<!-- ======================================
     登録済み作品
     ====================================== -->
<section class="admin-list">
    <h2>
        登録済み作品
    </h2>
    <table class="admin-table">
        <thead>
            <tr>
                <th>
                    No
                </th>
                <th>
                    タイトル
                </th>
                <th>
                    カテゴリ
                </th>
                <th>
                    難易度
                </th>
                <th>
                    操作
                </th>
            </tr>
        </thead>
        <tbody
            id="workList"
        ></tbody>
    </table>
</section>
</main>
<!-- ======================================
     フッター
     ====================================== -->
<footer id="footer"></footer>
<!-- ======================================
     共通JS
     ====================================== -->
<script
    src="assets/js/common.js"
></script>
<!-- ======================================
     作品データ
     ====================================== -->
<script
    src="assets/data/works.js"
></script>
<!-- ======================================
     管理画面JS
     ====================================== -->
<script
    src="assets/js/admin.js"
></script>
</body>
</html>
