<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>
<title>
管理画面 | Project Library
</title>

<!-- ======================================
     管理画面ログイン確認
     ====================================== -->
<script>
if(
    sessionStorage.getItem("adminLoggedIn")
    !==
    "true"
){
    location.href =
        "admin-login.html";
}

function logout(){
    sessionStorage.removeItem(
        "adminLoggedIn"
    );

    location.href =
        "admin-login.html";
}
</script>

<!-- ======================================
     共通CSS
     ====================================== -->
<link
    rel="stylesheet"
    href="assets/css/style.css"
>

<style>

/* ======================================
   管理画面 Version 10.0
   ====================================== */

/* --------------------------------------
   前回データ反映
   -------------------------------------- */

.previous-data-button{
    width:100%;
    max-width:520px;
    margin:0 0 18px;
    padding:11px 14px;
    border:1px solid #c9dced;
    border-radius:8px;
    background:#f5faff;
    color:#315f86;
    font-size:14px;
    cursor:pointer;
}

.previous-data-button:hover{
    background:#edf7ff;
}

.previous-data-help{
    margin:-10px 0 18px;
    color:#777;
    font-size:12px;
    line-height:1.5;
}

/* --------------------------------------
   カテゴリ
   -------------------------------------- */

.admin-category-grid{
    display:grid;
    grid-template-columns:
        repeat(2, minmax(0, 1fr));
    gap:10px;
    max-width:520px;
}

.admin-category-grid label{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 12px;
    border:1px solid #ddd;
    border-radius:8px;
    background:#fff;
    cursor:pointer;
    line-height:1.4;
}

.admin-category-grid input{
    flex-shrink:0;
}

/* --------------------------------------
   タグ・シリーズ検索
   -------------------------------------- */

.choice-search-wrap{
    position:relative;
    margin-bottom:10px;
}

.choice-search{
    width:100%;
    box-sizing:border-box;
    padding:10px 12px 10px 38px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:14px;
    background:#fff;
}

.choice-search-icon{
    position:absolute;
    left:12px;
    top:50%;
    transform:
        translateY(-50%);
    color:#888;
    pointer-events:none;
}

/* --------------------------------------
   選択中
   -------------------------------------- */

.selected-choice-area{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:10px;
}

.selected-choice{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:5px 8px;
    border-radius:999px;
    background:#eef6ff;
    border:1px solid #b8d8ff;
    color:#245a8d;
    font-size:13px;
    line-height:1.3;
}

.selected-choice button{
    border:0;
    background:transparent;
    padding:0;
    margin:0;
    color:#245a8d;
    font-size:15px;
    line-height:1;
    cursor:pointer;
}

/* --------------------------------------
   候補一覧
   -------------------------------------- */

.choice-results{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    max-height:180px;
    overflow-y:auto;
    margin-bottom:10px;
}

.choice-button{
    border:1px solid #ddd;
    background:#fff;
    border-radius:999px;
    padding:6px 11px;
    font-size:13px;
    line-height:1.4;
    cursor:pointer;
}

.choice-button:hover{
    background:#f7f7f7;
}

.choice-button.selected{
    background:#eaf4ff;
    border-color:#76aee8;
    color:#245a8d;
}

.choice-empty{
    margin:5px 0;
    color:#888;
    font-size:13px;
}

/* --------------------------------------
   新規作成
   -------------------------------------- */

.new-choice-toggle{
    border:0;
    background:transparent;
    padding:4px 0;
    color:#527da5;
    font-size:13px;
    cursor:pointer;
}

.new-choice-area{
    display:none;
    margin-top:8px;
}

.new-choice-area.open{
    display:block;
}

.new-choice-area input{
    width:100%;
    box-sizing:border-box;
}

/* --------------------------------------
   補足
   -------------------------------------- */

.admin-help-text{
    margin:7px 0 0;
    font-size:13px;
    color:#777;
    line-height:1.6;
}

/* --------------------------------------
   サムネイル
   -------------------------------------- */

.admin-thumbnail-preview{
    width:220px;
    max-width:100%;
    min-height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border:1px solid #ddd;
    border-radius:6px;
    background:#fafafa;
}

.admin-thumbnail-preview img{
    display:block;
    width:220px;
    max-width:100%;
    height:auto;
}

/* --------------------------------------
   スマホ
   -------------------------------------- */

@media(
    max-width:600px
){
    .admin-category-grid{
        gap:8px;
    }

    .admin-category-grid label{
        padding:9px 8px;
        font-size:13px;
    }

    .choice-results{
        max-height:150px;
    }

    .previous-data-button{
        font-size:13px;
    }
}

</style>
</head>

<body>

<!-- ======================================
     ヘッダー
     ====================================== -->
<header id="header"></header>

<!-- ======================================
     サイドバー
     ====================================== -->
<div id="sidebar"></div>

<!-- ======================================
     メイン
     ====================================== -->
<main class="admin-container">

<!-- ======================================
     タイトル・ログアウト
     ====================================== -->

<div
    style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:20px;
        flex-wrap:wrap;
    "
>
    <div>

        <h1>
            📚 Project Library 管理画面
        </h1>

        <p class="admin-subtitle">
            作品登録・編集・管理を行います
        </p>

    </div>

    <button
        type="button"
        onclick="logout()"
    >
        ログアウト
    </button>

</div>


<!-- ======================================
     前回データ反映
     ====================================== -->

<button
    type="button"
    id="usePreviousDataButton"
    class="previous-data-button"
>
    📋 前回のデータを反映
</button>

<p class="previous-data-help">
    直前に登録した作品の設定をコピーします。
    PDF・サムネイルはコピーされません。
</p>


<!-- ======================================
     作品登録フォーム
     ====================================== -->

<form
    id="workForm"
>

<!-- ======================================
     タイトル
     ====================================== -->

<div class="admin-form-item">

    <label
        for="title"
    >
        タイトル
    </label>

    <input
        type="text"
        id="title"
        name="title"
        placeholder="作品タイトルを入力"
        required
    >

</div>


<!-- ======================================
     PDF
     ====================================== -->

<div class="admin-form-item">

    <label
        for="pdfFile"
    >
        PDFファイル
    </label>

    <input
        type="file"
        id="pdfFile"
        name="pdfFile"
        accept=".pdf,application/pdf"
    >

    <p class="admin-help-text">
        PDFを選択すると、
        1ページ目からサムネイルを自動作成します。
    </p>

</div>


<!-- ======================================
     サムネイル
     ====================================== -->

<div class="admin-form-item">

    <label>
        サムネイル
    </label>

    <div
        id="thumbnailPreview"
        class="admin-thumbnail-preview"
    >

        <span>
            PDFを選択すると表示されます
        </span>

    </div>

</div>


<!-- ======================================
     カテゴリ
     ====================================== -->

<div class="admin-form-item">

    <label>
        カテゴリ
    </label>

    <div class="admin-category-grid">

        <label>
            <input
                type="checkbox"
                value="幼児向け"
                data-category
            >

            <span>
                幼児向け
            </span>
        </label>

        <label>
            <input
                type="checkbox"
                value="子ども向け"
                data-category
            >

            <span>
                子ども向け
            </span>
        </label>

        <label>
            <input
                type="checkbox"
                value="大人向け"
                data-category
            >

            <span>
                大人向け
            </span>
        </label>

        <label>
            <input
                type="checkbox"
                value="シニア・リハビリ"
                data-category
            >

            <span>
                シニア・リハビリ
            </span>
        </label>

    </div>

    <p class="admin-help-text">
        複数選択できます。
    </p>

</div>


<!-- ======================================
     固定タグ
     ====================================== -->

<div class="admin-form-item">

    <label>
        固定タグ
    </label>

    <div
        id="fixedTagSelected"
        class="selected-choice-area"
    ></div>

    <div class="choice-search-wrap">

        <span
            class="choice-search-icon"
        >
            🔎
        </span>

        <input
            type="text"
            id="fixedTagSearch"
            class="choice-search"
            placeholder="タグを検索"
            autocomplete="off"
        >

    </div>

    <div
        id="fixedTagChoices"
        class="choice-results"
    ></div>

    <button
        type="button"
        id="newFixedTagToggle"
        class="new-choice-toggle"
    >
        ＋ 新しい固定タグを作る
    </button>

    <div
        id="newFixedTagArea"
        class="new-choice-area"
    >

        <input
            type="text"
            id="newFixedTag"
            name="newFixedTag"
            placeholder="新しい固定タグ"
        >

        <p class="admin-help-text">
            複数作る場合はカンマ区切り
        </p>

    </div>

</div>


<!-- ======================================
     自由タグ
     ====================================== -->

<div class="admin-form-item">

    <label>
        自由タグ
    </label>

    <div
        id="freeTagSelected"
        class="selected-choice-area"
    ></div>

    <div class="choice-search-wrap">

        <span
            class="choice-search-icon"
        >
            🔎
        </span>

        <input
            type="text"
            id="freeTagSearch"
            class="choice-search"
            placeholder="タグを検索"
            autocomplete="off"
        >

    </div>

    <div
        id="freeTagChoices"
        class="choice-results"
    ></div>

    <button
        type="button"
        id="newFreeTagToggle"
        class="new-choice-toggle"
    >
        ＋ 新しい自由タグを作る
    </button>

    <div
        id="newFreeTagArea"
        class="new-choice-area"
    >

        <input
            type="text"
            id="newFreeTag"
            name="newFreeTag"
            placeholder="新しい自由タグ"
        >

        <p class="admin-help-text">
            複数作る場合はカンマ区切り
        </p>

    </div>

</div>


<!-- ======================================
     シリーズ
     ====================================== -->

<div class="admin-form-item">

    <label>
        シリーズ
    </label>

    <div
        id="seriesSelected"
        class="selected-choice-area"
    ></div>

    <div class="choice-search-wrap">

        <span
            class="choice-search-icon"
        >
            🔎
        </span>

        <input
            type="text"
            id="seriesSearch"
            class="choice-search"
            placeholder="シリーズを検索"
            autocomplete="off"
        >

    </div>

    <div
        id="seriesChoices"
        class="choice-results"
    ></div>

    <button
        type="button"
        id="newSeriesToggle"
        class="new-choice-toggle"
    >
        ＋ 新しいシリーズを作る
    </button>

    <div
        id="newSeriesArea"
        class="new-choice-area"
    >

        <input
            type="text"
            id="newSeries"
            name="newSeries"
            placeholder="新しいシリーズ名"
        >

    </div>

</div>


<!-- ======================================
     難易度
     ====================================== -->

<div class="admin-form-item">

    <label
        for="difficulty"
    >
        難易度
    </label>

    <select
        id="difficulty"
        name="difficulty"
    >

        <option value="1">
            ★☆☆ 初級
        </option>

        <option value="2">
            ★★☆ 中級
        </option>

        <option value="3">
            ★★★ 上級
        </option>

    </select>

</div>


<!-- ======================================
     印刷サイズ
     ====================================== -->

<div class="admin-form-item">

    <label
        for="size"
    >
        印刷サイズ
    </label>

    <select
        id="size"
        name="size"
    >

        <option value="A4">
            A4
        </option>

        <option value="A3">
            A3
        </option>

    </select>

</div>


<!-- ======================================
     説明
     ====================================== -->

<div class="admin-form-item">

    <label
        for="description"
    >
        説明
    </label>

    <textarea
        id="description"
        name="description"
        rows="6"
        placeholder="作品の説明を入力してください"
    ></textarea>

</div>


<!-- ======================================
     編集ID
     ====================================== -->

<input
    type="hidden"
    id="editId"
    name="editId"
>

</form>


<!-- ======================================
     下部操作ボタン
     ====================================== -->

<div class="admin-bottom-bar">

    <button
        type="button"
        class="draft"
    >
        下書き保存
    </button>

    <button
        type="button"
        class="publish"
    >
        🚀 公開する
    </button>

</div>


<!-- ======================================
     登録済み作品
     ====================================== -->

<section class="admin-list">

    <h2>
        登録済み作品
    </h2>

    <table class="admin-table">

        <thead>

            <tr>

                <th>
                    No
                </th>

                <th>
                    タイトル
                </th>

                <th>
                    カテゴリ
                </th>

                <th>
                    難易度
                </th>

                <th>
                    操作
                </th>

            </tr>

        </thead>

        <tbody
            id="workList"
        ></tbody>

    </table>

</section>

</main>


<!-- ======================================
     フッター
     ====================================== -->

<footer id="footer"></footer>


<!-- ======================================
     共通JS
     ====================================== -->

<script
    src="assets/js/common.js"
></script>


<!-- ======================================
     作品データ
     ====================================== -->

<script
    src="assets/data/works.js"
></script>


<!-- ======================================
     管理画面JS
     ====================================== -->

<script
    src="assets/js/admin.js"
></script>

</body>
</html>
