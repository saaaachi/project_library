<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
管理画面 | Project Library
</title>


<!-- ======================================
     管理画面ログイン確認
     ====================================== -->

<script>

if(
    sessionStorage.getItem("adminLoggedIn")
    !==
    "true"
){

    location.href =
        "admin-login.html";

}


function logout(){

    sessionStorage.removeItem(
        "adminLoggedIn"
    );

    location.href =
        "admin-login.html";

}

</script>


<!-- ======================================
     共通CSS
     ====================================== -->

<link
    rel="stylesheet"
    href="assets/css/style.css"
>


<style>

/* ======================================
   管理画面 Version 12.0
   ====================================== */


/* --------------------------------------
   前回データ反映
   -------------------------------------- */

.previous-data-button{

    width:100%;
    max-width:520px;

    margin:0 0 18px;

    padding:11px 14px;

    border:1px solid #c9dced;
    border-radius:8px;

    background:#f5faff;
    color:#315f86;

    font-size:14px;

    cursor:pointer;

}


.previous-data-button:hover{

    background:#edf7ff;

}


.previous-data-help{

    margin:-10px 0 18px;

    color:#777;

    font-size:12px;

    line-height:1.5;

}


/* --------------------------------------
   作品管理検索
   -------------------------------------- */

.admin-manage-section{

    margin:35px 0 40px;

    padding:20px;

    border:1px solid #e1e1e1;
    border-radius:10px;

    background:#fafafa;

}


.admin-manage-section h2{

    margin-top:0;

}


.admin-manage-help{

    margin:6px 0 15px;

    color:#777;

    font-size:13px;

    line-height:1.6;

}


.admin-work-search-row{

    display:flex;

    gap:8px;

    max-width:520px;

}


.admin-work-search-input{

    flex:1;

    min-width:0;

    box-sizing:border-box;

    padding:11px 12px;

    border:1px solid #ccc;
    border-radius:8px;

    background:#fff;

    font-size:14px;

}


.admin-work-search-button{

    flex-shrink:0;

    padding:11px 15px;

    border:0;
    border-radius:8px;

    background:#527da5;
    color:#fff;

    font-size:14px;

    cursor:pointer;

}


.admin-work-search-button:hover{

    opacity:.9;

}


/* --------------------------------------
   検索結果
   -------------------------------------- */

.admin-search-result{

    margin-top:18px;

}


.admin-search-count{

    margin:0 0 10px;

    color:#666;

    font-size:13px;

}


.admin-search-empty{

    padding:15px;

    border-radius:8px;

    background:#fff;

    color:#777;

    font-size:13px;

}


.admin-search-card{

    display:flex;

    gap:18px;

    align-items:flex-start;

    padding:15px;

    border:1px solid #ddd;
    border-radius:10px;

    background:#fff;

}


.admin-search-card + .admin-search-card{

    margin-top:12px;

}


.admin-search-image{

    flex:0 0 150px;

    width:150px;

    border:1px solid #ddd;

    border-radius:6px;

    overflow:hidden;

    background:#fafafa;

}


.admin-search-image img{

    display:block;

    width:100%;

    height:auto;

}


.admin-search-info{

    flex:1;

    min-width:0;

}


.admin-search-info h3{

    margin:0 0 8px;

    font-size:17px;

    line-height:1.5;

}


/* --------------------------------------
   作品番号
   -------------------------------------- */

.admin-search-workno{

    display:inline-flex;

    align-items:center;

    gap:6px;

    margin:0 0 10px;

    padding:7px 10px;

    border-radius:7px;

    background:#eef6ff;

    color:#315f86;

    font-size:13px;

    font-weight:600;

}


.admin-search-workno strong{

    font-size:15px;

    letter-spacing:.03em;

}


.admin-search-category{

    margin:0 0 12px;

    color:#666;

    font-size:13px;

    line-height:1.6;

}


.admin-search-actions{

    display:flex;

    flex-wrap:wrap;

    gap:8px;

}


.admin-search-actions button{

    padding:8px 12px;

    border-radius:7px;

    font-size:13px;

    cursor:pointer;

}


.admin-search-edit{

    border:1px solid #8db6d8;

    background:#f3f9ff;

    color:#315f86;

}


.admin-search-delete{

    border:1px solid #e1aaaa;

    background:#fff6f6;

    color:#a34747;

}


/* --------------------------------------
   カテゴリ
   -------------------------------------- */

.admin-category-grid{

    display:grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap:10px;

    max-width:520px;

}


.admin-category-grid label{

    display:flex;

    align-items:center;

    gap:8px;

    padding:10px 12px;

    border:1px solid #ddd;

    border-radius:8px;

    background:#fff;

    cursor:pointer;

    line-height:1.4;

}


.admin-category-grid input{

    flex-shrink:0;

}


/* --------------------------------------
   タグ・シリーズ検索
   -------------------------------------- */

.choice-search-wrap{

    position:relative;

    margin-bottom:10px;

}


.choice-search{

    width:100%;

    box-sizing:border-box;

    padding:10px 12px 10px 38px;

    border:1px solid #ddd;

    border-radius:8px;

    font-size:14px;

    background:#fff;

}


.choice-search-icon{

    position:absolute;

    left:12px;

    top:50%;

    transform:
        translateY(-50%);

    color:#888;

    pointer-events:none;

}


/* --------------------------------------
   選択中
   -------------------------------------- */

.selected-choice-area{

    display:flex;

    flex-wrap:wrap;

    gap:6px;

    margin-bottom:10px;

}


.selected-choice{

    display:inline-flex;

    align-items:center;

    gap:5px;

    padding:5px 8px;

    border-radius:999px;

    background:#eef6ff;

    border:1px solid #b8d8ff;

    color:#245a8d;

    font-size:13px;

    line-height:1.3;

}


.selected-choice button{

    border:0;

    background:transparent;

    padding:0;

    margin:0;

    color:#245a8d;

    font-size:15px;

    line-height:1;

    cursor:pointer;

}


/* --------------------------------------
   候補一覧
   -------------------------------------- */

.choice-results{

    display:flex;

    flex-wrap:wrap;

    gap:6px;

    max-height:180px;

    overflow-y:auto;

    margin-bottom:10px;

}


.choice-button{

    border:1px solid #ddd;

    background:#fff;

    border-radius:999px;

    padding:6px 11px;

    font-size:13px;

    line-height:1.4;

    cursor:pointer;

}


.choice-button:hover{

    background:#f7f7f7;

}


.choice-button.selected{

    background:#eaf4ff;

    border-color:#76aee8;

    color:#245a8d;

}


.choice-empty{

    margin:5px 0;

    color:#888;

    font-size:13px;

}


/* --------------------------------------
   新規作成
   -------------------------------------- */

.new-choice-toggle{

    border:0;

    background:transparent;

    padding:4px 0;

    color:#527da5;

    font-size:13px;

    cursor:pointer;

}


.new-choice-area{

    display:none;

    margin-top:8px;

}


.new-choice-area.open{

    display:block;

}


.new-choice-area input{

    width:100%;

    box-sizing:border-box;

}


/* --------------------------------------
   補足
   -------------------------------------- */

.admin-help-text{

    margin:7px 0 0;

    font-size:13px;

    color:#777;

    line-height:1.6;

}


/* --------------------------------------
   サムネイル
   -------------------------------------- */

.admin-thumbnail-preview{

    width:220px;

    max-width:100%;

    min-height:60px;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    border:1px solid #ddd;

    border-radius:6px;

    background:#fafafa;

}


.admin-thumbnail-preview img{

    display:block;

    width:220px;

    max-width:100%;

    height:auto;

}


/* --------------------------------------
   スマホ
   -------------------------------------- */

@media(
    max-width:600px
){

    .admin-category-grid{

        gap:8px;

    }


    .admin-category-grid label{

        padding:9px 8px;

        font-size:13px;

    }


    .choice-results{

        max-height:150px;

    }


    .previous-data-button{

        font-size:13px;

    }


    .admin-work-search-row{

        flex-direction:column;

    }


    .admin-work-search-button{

        width:100%;

    }


    .admin-search-card{

        flex-direction:column;

    }


    .admin-search-image{

        width:180px;

        max-width:100%;

        flex-basis:auto;

    }


    .admin-search-info{

        width:100%;

    }


    .admin-search-actions button{

        flex:1;

    }

}

</style>

</head>


<body>


<header id="header"></header>

<div id="sidebar"></div>


<main class="admin-container">


<div
    style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:20px;
        flex-wrap:wrap;
    "
>

    <div>

        <h1>
            📚 Project Library 管理画面
        </h1>

        <p class="admin-subtitle">
            作品登録・編集・管理を行います
        </p>

    </div>


    <button
        type="button"
        onclick="logout()"
    >
        ログアウト
    </button>

</div>


<button
    type="button"
    id="usePreviousDataButton"
    class="previous-data-button"
>
    📋 前回のデータを反映
</button>


<p class="previous-data-help">

    直前に登録した作品の設定をコピーします。
    PDF・サムネイルはコピーされません。

</p>


<form id="workForm">


<div class="admin-form-item">

    <label
        for="title"
    >
        タイトル
    </label>


    <input
        type="text"
        id="title"
        name="title"
        placeholder="作品タイトルを入力"
        required
    >

</div>


<div class="admin-form-item">

    <label
        for="pdfFile"
    >
        PDFファイル
    </label>


    <input
        type="file"
        id="pdfFile"
        name="pdfFile"
        accept=".pdf,application/pdf"
    >


    <p class="admin-help-text">

        PDFを選択すると、
        1ページ目からサムネイルを自動作成します。

    </p>

</div>


<div class="admin-form-item">

    <label>
        サムネイル
    </label>


    <div
        id="thumbnailPreview"
        class="admin-thumbnail-preview"
    >

        <span>
            PDFを選択すると表示されます
        </span>

    </div>

</div>


<div class="admin-form-item">

    <label>
        カテゴリ
    </label>


    <div class="admin-category-grid">


        <label>

            <input
                type="checkbox"
                value="幼児向け"
                data-category
            >

            <span>
                幼児向け
            </span>

        </label>


        <label>

            <input
                type="checkbox"
                value="子ども向け"
                data-category
            >

            <span>
                子ども向け
            </span>

        </label>


        <label>

            <input
                type="checkbox"
                value="大人向け"
                data-category
            >

            <span>
                大人向け
            </span>

        </label>


        <label>

            <input
                type="checkbox"
                value="シニア・リハビリ"
                data-category
            >

            <span>
                シニア・リハビリ
            </span>

        </label>


    </div>


    <p class="admin-help-text">
        複数選択できます。
    </p>

</div>


<div class="admin-form-item">

    <label>
        固定タグ
    </label>


    <div
        id="fixedTagSelected"
        class="selected-choice-area"
    ></div>


    <div class="choice-search-wrap">

        <span
            class="choice-search-icon"
        >
            🔎
        </span>


        <input
            type="text"
            id="fixedTagSearch"
            class="choice-search"
            placeholder="タグを検索"
            autocomplete="off"
        >

    </div>


    <div
        id="fixedTagChoices"
        class="choice-results"
    ></div>


    <button
        type="button"
        id="newFixedTagToggle"
        class="new-choice-toggle"
    >
        ＋ 新しい固定タグを作る
    </button>


    <div
        id="newFixedTagArea"
        class="new-choice-area"
    >

        <input
            type="text"
            id="newFixedTag"
            name="newFixedTag"
            placeholder="新しい固定タグ"
        >


        <p class="admin-help-text">
            複数作る場合はカンマ区切り
        </p>

    </div>

</div>


<div class="admin-form-item">

    <label>
        自由タグ
    </label>


    <div
        id="freeTagSelected"
        class="selected-choice-area"
    ></div>


    <div class="choice-search-wrap">

        <span
            class="choice-search-icon"
        >
            🔎
        </span>


        <input
            type="text"
            id="freeTagSearch"
            class="choice-search"
            placeholder="タグを検索"
            autocomplete="off"
        >

    </div>


    <div
        id="freeTagChoices"
        class="choice-results"
    ></div>


    <button
        type="button"
        id="newFreeTagToggle"
        class="new-choice-toggle"
    >
        ＋ 新しい自由タグを作る
    </button>


    <div
        id="newFreeTagArea"
        class="new-choice-area"
    >

        <input
            type="text"
            id="newFreeTag"
            name="newFreeTag"
            placeholder="新しい自由タグ"
        >


        <p class="admin-help-text">
            複数作る場合はカンマ区切り
        </p>

    </div>

</div>


<div class="admin-form-item">

    <label>
        シリーズ
    </label>


    <div
        id="seriesSelected"
        class="selected-choice-area"
    ></div>


    <div class="choice-search-wrap">

        <span
            class="choice-search-icon"
        >
            🔎
        </span>


        <input
            type="text"
            id="seriesSearch"
            class="choice-search"
            placeholder="シリーズを検索"
            autocomplete="off"
        >

    </div>


    <div
        id="seriesChoices"
        class="choice-results"
    ></div>


    <button
        type="button"
        id="newSeriesToggle"
        class="new-choice-toggle"
    >
        ＋ 新しいシリーズを作る
    </button>


    <div
        id="newSeriesArea"
        class="new-choice-area"
    >

        <input
            type="text"
            id="newSeries"
            name="newSeries"
            placeholder="新しいシリーズ名"
        >

    </div>

</div>


<div class="admin-form-item">

    <label
        for="difficulty"
    >
        難易度
    </label>


    <select
        id="difficulty"
        name="difficulty"
    >

        <option value="1">
            ★☆☆ 初級
        </option>

        <option value="2">
            ★★☆ 中級
        </option>

        <option value="3">
            ★★★ 上級
        </option>

    </select>

</div>


<div class="admin-form-item">

    <label
        for="size"
    >
        印刷サイズ
    </label>


    <select
        id="size"
        name="size"
    >

        <option value="A4">
            A4
        </option>

        <option value="A3">
            A3
        </option>

    </select>

</div>


<div class="admin-form-item">

    <label
        for="description"
    >
        説明
    </label>


    <textarea
        id="description"
        name="description"
        rows="6"
        placeholder="作品の説明を入力してください"
    ></textarea>

</div>


<input
    type="hidden"
    id="editId"
    name="editId"
>


</form>


<div class="admin-bottom-bar">

    <button
        type="button"
        class="draft"
    >
        下書き保存
    </button>


    <button
        type="button"
        class="publish"
    >
        🚀 公開する
    </button>

</div>


<!-- ======================================
     作品管理
     ====================================== -->

<section class="admin-manage-section">


    <h2>
        🔎 作品を管理
    </h2>


    <p class="admin-manage-help">

        作品番号の一部（例：123）または
        タイトルの一部で検索できます。
        最大3件まで表示します。

    </p>


    <div class="admin-work-search-row">


        <input
            type="text"
            id="workNumberSearch"
            class="admin-work-search-input"
            placeholder="例：123 / 消防車"
            autocomplete="off"
        >


        <button
            type="button"
            id="workNumberSearchButton"
            class="admin-work-search-button"
        >
            🔎 検索
        </button>


    </div>


    <div
        id="adminSearchResult"
        class="admin-search-result"
    >


        <p class="admin-search-empty">

            作品番号の一部または
            タイトルの一部を入力して検索してください。

        </p>


    </div>


</section>


</main>


<footer id="footer"></footer>


<script
    src="assets/js/common.js"
></script>


<script
    src="assets/data/works.js"
></script>


<script
    src="assets/js/admin.js"
></script>


</body>
</html>
