
# ======================================
# Project Library
# Delete Workflow
# Version 1.1
# ======================================
#
# 機能：
# ・削除依頼確認
# ・作品ID確認
# ・PDF削除
# ・サムネイル削除
# ・works.js更新
# ・SEOページ自動更新
# ・sitemap.xml自動更新
# ・削除依頼JSON削除
# ・GitHubへまとめて保存
#
# 注意：
# ・他の作品は削除しない
# ・SEO生成失敗時はpushしない
# ・投稿Workflowと同時実行しない
# ======================================

name: Project Library Delete

on:
  workflow_dispatch:
    inputs:
      deleteId:
        description: "削除依頼ID"
        required: true
        type: string

      workId:
        description: "削除対象作品ID"
        required: true
        type: string


# --------------------------------------
# 同時実行防止
# --------------------------------------

concurrency:
  group: project-library-publish
  cancel-in-progress: false


# --------------------------------------
# Permissions
# --------------------------------------

permissions:
  contents: write


# ======================================
# JOB
# ======================================

jobs:
  delete:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------
      # Checkout
      # ----------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ----------------------------------
      # Node.js準備
      # ----------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ----------------------------------
      # 基本情報確認
      # ----------------------------------

      - name: Check delete request
        env:
          WORK_ID: ${{ inputs.workId }}
          DELETE_ID: ${{ inputs.deleteId }}

        run: |
          echo "======================================"
          echo "Project Library Delete"
          echo "Version 1.1"
          echo "======================================"
          echo "deleteId: $DELETE_ID"
          echo "workId:   $WORK_ID"
          echo "======================================"

      # ----------------------------------
      # 削除対象確認
      # ----------------------------------

      - name: Find target work
        env:
          WORK_ID: ${{ inputs.workId }}
          DELETE_ID: ${{ inputs.deleteId }}

        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const worksPath = "assets/data/works.js";

          const workId = String(
            process.env.WORK_ID || ""
          ).trim();

          const deleteId = String(
            process.env.DELETE_ID || ""
          ).trim();

          // ----------------------------------
          // ID安全確認
          // ----------------------------------

          if (!/^[1-9]\d*$/.test(workId)) {
            console.error("❌ 作品IDが不正です。");
            process.exit(1);
          }

          if (
            !/^[a-zA-Z0-9_-]+$/.test(deleteId)
          ) {
            console.error("❌ 削除依頼IDが不正です。");
            process.exit(1);
          }

          const deleteRequestPath =
            `.project-library-delete/${deleteId}.json`;

          if (!fs.existsSync(deleteRequestPath)) {
            console.error(
              "❌ 削除依頼JSONがありません。"
            );
            process.exit(1);
          }

          if (!fs.existsSync(worksPath)) {
            console.error(
              "❌ works.jsがありません。"
            );
            process.exit(1);
          }

          // ----------------------------------
          // 削除依頼JSON確認
          // ----------------------------------

          let request;

          try {
            request = JSON.parse(
              fs.readFileSync(
                deleteRequestPath,
                "utf8"
              )
            );
          } catch (error) {
            console.error(
              "❌ 削除依頼JSONを読み込めません。"
            );
            process.exit(1);
          }

          // 依頼JSONにworkIdが存在する場合、
          // 入力されたIDとの一致を確認する

          if (
            request.workId !== undefined &&
            String(request.workId) !== workId
          ) {
            console.error(
              "❌ 削除依頼と作品IDが一致しません。"
            );
            process.exit(1);
          }

          // ----------------------------------
          // works.js読み込み
          // ----------------------------------

          const source = fs.readFileSync(
            worksPath,
            "utf8"
          );

          const startMarker = "const works = ";

          const startIndex =
            source.indexOf(startMarker);

          if (startIndex === -1) {
            console.error(
              "❌ works配列が見つかりません。"
            );
            process.exit(1);
          }

          const arrayStart =
            startIndex + startMarker.length;

          const arrayEnd =
            source.indexOf("];", arrayStart);

          if (arrayEnd === -1) {
            console.error(
              "❌ works配列の終了位置が見つかりません。"
            );
            process.exit(1);
          }

          const arrayText = source
            .slice(arrayStart, arrayEnd + 1)
            .trim();

          let works;

          try {
            works = JSON.parse(arrayText);
          } catch (error) {
            console.error(
              "❌ works.jsの解析に失敗しました。"
            );
            console.error(error);
            process.exit(1);
          }

          if (!Array.isArray(works)) {
            console.error(
              "❌ worksデータが配列ではありません。"
            );
            process.exit(1);
          }

          // ----------------------------------
          // 対象作品検索
          // ----------------------------------

          const targetIndex = works.findIndex(
            work => String(work.id) === workId
          );

          if (targetIndex === -1) {
            console.error(
              `❌ 作品ID ${workId} がありません。`
            );
            process.exit(1);
          }

          const target = works[targetIndex];

          // ----------------------------------
          // 削除ファイルパス安全確認
          // ----------------------------------

          function validatePath(
            value,
            expectedDirectory
          ) {
            if (
              typeof value !== "string" ||
              !value.startsWith(
                expectedDirectory + "/"
              )
            ) {
              throw new Error(
                "削除対象パスが不正です。"
              );
            }

            const normalized = path.posix.normalize(
              value.replace(/\\/g, "/")
            );

            if (
              !normalized.startsWith(
                expectedDirectory + "/"
              ) ||
              normalized === expectedDirectory ||
              normalized.includes("..") ||
              path.posix.basename(normalized) === ""
            ) {
              throw new Error(
                "安全でない削除パスです。"
              );
            }

            return normalized;
          }

          let pdfPath;
          let thumbnailPath;

          try {
            pdfPath = validatePath(
              target.pdf,
              "assets/pdf"
            );

            thumbnailPath = validatePath(
              target.thumbnail,
              "assets/images/thumbnail"
            );
          } catch (error) {
            console.error(
              "❌ " + error.message
            );
            process.exit(1);
          }

          // ----------------------------------
          // 対象情報保存
          // ----------------------------------

          const targetInfo = {
            id: target.id,
            workNo: target.workNo || "",
            title: target.title || "",
            pdf: pdfPath,
            thumbnail: thumbnailPath,
            deleteRequest: deleteRequestPath
          };

          fs.writeFileSync(
            ".delete-target.json",
            JSON.stringify(
              targetInfo,
              null,
              2
            ),
            "utf8"
          );

          console.log("======================================");
          console.log("削除対象作品を確認しました。");
          console.log(`作品ID：${target.id}`);
          console.log(`タイトル：${target.title}`);
          console.log(`PDF：${pdfPath}`);
          console.log(`サムネイル：${thumbnailPath}`);
          console.log("======================================");
          NODE

      # ----------------------------------
      # 削除対象情報表示
      # ----------------------------------

      - name: Show delete target
        run: |
          echo "======================================"
          echo "削除対象"
          echo "======================================"

          cat .delete-target.json

      # ----------------------------------
      # PDF・サムネイル・削除依頼削除
      # ----------------------------------

      - name: Delete PDF thumbnail and request
        run: |
          node <<'NODE'
          const fs = require("fs");

          const target = JSON.parse(
            fs.readFileSync(
              ".delete-target.json",
              "utf8"
            )
          );

          function removeFile(filePath) {
            if (!fs.existsSync(filePath)) {
              console.log(
                `ファイルが存在しないためスキップ：${filePath}`
              );
              return;
            }

            fs.unlinkSync(filePath);

            console.log(
              `削除しました：${filePath}`
            );
          }

          removeFile(target.pdf);
          removeFile(target.thumbnail);
          removeFile(target.deleteRequest);

          console.log(
            "✅ PDF・サムネイル・削除依頼JSONの削除完了"
          );
          NODE

      # ----------------------------------
      # works.js更新
      # ----------------------------------

      - name: Update works.js
        env:
          WORK_ID: ${{ inputs.workId }}

        run: |
          node <<'NODE'
          const fs = require("fs");

          const worksPath = "assets/data/works.js";

          const source = fs.readFileSync(
            worksPath,
            "utf8"
          );

          const startMarker = "const works = ";

          const startIndex =
            source.indexOf(startMarker);

          if (startIndex === -1) {
            console.error(
              "❌ works配列が見つかりません。"
            );
            process.exit(1);
          }

          const arrayStart =
            startIndex + startMarker.length;

          const arrayEnd =
            source.indexOf("];", arrayStart);

          if (arrayEnd === -1) {
            console.error(
              "❌ works配列の終了位置が見つかりません。"
            );
            process.exit(1);
          }

          const arrayText = source
            .slice(arrayStart, arrayEnd + 1)
            .trim();

          let works;

          try {
            works = JSON.parse(arrayText);
          } catch (error) {
            console.error(
              "❌ works.jsの解析に失敗しました。"
            );
            process.exit(1);
          }

          const workId = String(
            process.env.WORK_ID
          );

          const targetIndex = works.findIndex(
            work => String(work.id) === workId
          );

          if (targetIndex === -1) {
            console.error(
              `❌ 作品ID ${workId} がありません。`
            );
            process.exit(1);
          }

          const target = works[targetIndex];

          works.splice(targetIndex, 1);

          const newArray = JSON.stringify(
            works,
            null,
            4
          );

          const newSource =
            source.slice(0, arrayStart) +
            newArray +
            source.slice(arrayEnd + 1);

          fs.writeFileSync(
            worksPath,
            newSource,
            "utf8"
          );

          console.log("======================================");
          console.log(
            `作品ID ${workId} を削除しました。`
          );
          console.log(`タイトル：${target.title}`);
          console.log(`現在の作品数：${works.length}`);
          console.log("======================================");
          NODE

      # ----------------------------------
      # SEO Generator構文確認
      # ----------------------------------

      - name: Check SEO Generator
        run: |
          set -e

          test -f tools/generate-seo.js

          node --check tools/generate-seo.js

          echo "✅ SEO Generator構文確認完了"

      # ----------------------------------
      # SEOページ・サイトマップ更新
      # ----------------------------------

      - name: Regenerate SEO pages and sitemap
        run: |
          set -e

          echo "======================================"
          echo "SEOページ・サイトマップ更新"
          echo "======================================"

          node tools/generate-seo.js

          echo "✅ SEO再生成完了"

      # ----------------------------------
      # 削除SEOページ確認
      # ----------------------------------

      - name: Verify SEO deletion
        env:
          WORK_ID: ${{ inputs.workId }}

        run: |
          set -e

          python3 <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          work_id = os.environ["WORK_ID"]

          deleted_page = Path(
              f"works/{work_id}.html"
          )

          sitemap_path = Path("sitemap.xml")

          if deleted_page.exists():
              sys.exit(
                  "❌ 削除対象のSEOページが残っています。"
              )

          if not sitemap_path.is_file():
              sys.exit(
                  "❌ sitemap.xmlがありません。"
              )

          sitemap = sitemap_path.read_text(
              encoding="utf-8"
          )

          urls = re.findall(
              r"<loc>\s*([^<]+)\s*</loc>",
              sitemap
          )

          deleted_url = (
              "https://saaaachi.github.io/"
              "project_library/works/"
              + work_id
              + ".html"
          )

          if deleted_url in urls:
              sys.exit(
                  "❌ 削除作品のURLがサイトマップに残っています。"
              )

          pages = list(
              Path("works").glob("*.html")
          )

          for page in pages:
              html = page.read_text(
                  encoding="utf-8"
              )

              if 'rel="canonical"' not in html:
                  sys.exit(
                      f"❌ canonicalがありません: {page}"
                  )

              expected_url = (
                  "https://saaaachi.github.io/"
                  "project_library/works/"
                  + page.name
              )

              if expected_url not in urls:
                  sys.exit(
                      f"❌ sitemapにURLがありません: {page}"
                  )

          print("======================================")
          print("✅ SEO削除結果確認完了")
          print(f"残りのSEO作品ページ：{len(pages)}件")
          print("======================================")
          PY

      # ----------------------------------
      # 変更確認
      # ----------------------------------

      - name: Check changes
        run: |
          echo "======================================"
          echo "変更内容"
          echo "======================================"

          git status --short

          echo "======================================"
          echo "削除対象"
          echo "======================================"

          cat .delete-target.json

      # ----------------------------------
      # 一時対象情報削除
      # ----------------------------------

      - name: Remove temporary target info
        run: |
          rm -f .delete-target.json

      # ----------------------------------
      # Commit & Push
      # ----------------------------------

      - name: Commit and push deletion
        env:
          WORK_ID: ${{ inputs.workId }}

        run: |
          set -e

          git config user.name "Project Library Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 削除対象の正式ファイル
          git add -A assets/pdf
          git add -A assets/images/thumbnail

          # 作品データ
          git add assets/data/works.js

          # 削除依頼JSON
          git add -A .project-library-delete

          # SEOページとサイトマップ
          git add -A works/
          git add sitemap.xml

          if git diff --cached --quiet; then
            echo "❌ 保存する変更がありません。"
            exit 1
          fi

          git commit -m "delete: work ${WORK_ID}"

          git push origin HEAD:main

      # ----------------------------------
      # 完了
      # ----------------------------------

      - name: Delete completed
        env:
          WORK_ID: ${{ inputs.workId }}
          DELETE_ID: ${{ inputs.deleteId }}

        run: |
          echo ""
          echo "======================================"
          echo "🎉 Project Library Delete"
          echo "Version 1.1"
          echo "======================================"
          echo "作品ID：$WORK_ID"
          echo "削除依頼ID：$DELETE_ID"
          echo ""
          echo "PDF：削除完了"
          echo "サムネイル：削除完了"
          echo "works.js：更新完了"
          echo "削除依頼：削除完了"
          echo "SEO作品ページ：更新完了"
          echo "sitemap.xml：更新完了"
          echo ""
          echo "正式公開ファイルの削除に成功しました！"
          echo "======================================"
