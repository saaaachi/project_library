name: Project Library Publish

on:
  workflow_dispatch:
    inputs:

      title:
        description: '作品タイトル'
        required: true
        type: string

      category:
        description: 'カテゴリ'
        required: true
        type: string

      fixedTags:
        description: '固定タグ'
        required: false
        type: string

      freeTags:
        description: '自由タグ'
        required: false
        type: string

      uploadId:
        description: 'アップロードID'
        required: false
        type: string

      pdfPath:
        description: '一時PDFパス'
        required: false
        type: string

      thumbnailPath:
        description: '一時サムネイルパス'
        required: false
        type: string


concurrency:
  group: project-library-publish
  cancel-in-progress: false


jobs:

  publish:

    runs-on: ubuntu-latest

    permissions:
      contents: write


    steps:

      # --------------------------------------
      # GitHubリポジトリ取得
      # --------------------------------------

      - name: Repository checkout

        uses: actions/checkout@v4


      # --------------------------------------
      # 公開情報確認
      # --------------------------------------

      - name: Show publish information

        run: |

          echo "======================================"
          echo "Project Library Publish"
          echo "Version 10.1"
          echo "======================================"

          echo "Title:"
          echo "${{ github.event.inputs.title }}"

          echo ""

          echo "Category:"
          echo "${{ github.event.inputs.category }}"

          echo ""

          echo "Fixed Tags:"
          echo "${{ github.event.inputs.fixedTags }}"

          echo ""

          echo "Free Tags:"
          echo "${{ github.event.inputs.freeTags }}"

          echo ""

          echo "Upload ID:"
          echo "${{ github.event.inputs.uploadId }}"

          echo ""

          echo "PDF Path:"
          echo "${{ github.event.inputs.pdfPath }}"

          echo ""

          echo "Thumbnail Path:"
          echo "${{ github.event.inputs.thumbnailPath }}"

          echo "======================================"


      # --------------------------------------
      # 一時アップロードファイル確認
      # --------------------------------------

      - name: Check uploaded files

        run: |

          echo "アップロードファイル確認を開始します。"

          if [ -z "${{ github.event.inputs.pdfPath }}" ]; then
            echo "❌ PDFパスが指定されていません。"
            exit 1
          fi

          if [ -z "${{ github.event.inputs.thumbnailPath }}" ]; then
            echo "❌ サムネイルパスが指定されていません。"
            exit 1
          fi

          if [ -z "${{ github.event.inputs.uploadId }}" ]; then
            echo "❌ アップロードIDが指定されていません。"
            exit 1
          fi


          echo ""
          echo "PDF："
          echo "${{ github.event.inputs.pdfPath }}"

          if [ ! -f "${{ github.event.inputs.pdfPath }}" ]; then

            echo "❌ PDFファイルが見つかりません。"
            exit 1

          fi

          echo "✅ PDFファイルを確認しました😊"


          echo ""
          echo "サムネイル："
          echo "${{ github.event.inputs.thumbnailPath }}"

          if [ ! -f "${{ github.event.inputs.thumbnailPath }}" ]; then

            echo "❌ サムネイルファイルが見つかりません。"
            exit 1

          fi

          echo "✅ サムネイルファイルを確認しました😊"


      # --------------------------------------
      # metadata確認
      # --------------------------------------

      - name: Check metadata

        run: |

          METADATA_PATH=".project-library-upload/metadata/${{ github.event.inputs.uploadId }}.json"

          echo "作品情報を確認します。"

          echo ""
          echo "Metadata："
          echo "$METADATA_PATH"


          if [ ! -f "$METADATA_PATH" ]; then

            echo "❌ metadataファイルが見つかりません。"
            exit 1

          fi


          echo ""
          echo "metadata内容："
          cat "$METADATA_PATH"


          echo ""
          echo "======================================"
          echo "✅ metadataを確認しました😊"
          echo "======================================"


      # --------------------------------------
      # 正式フォルダ作成
      # --------------------------------------

      - name: Create final directories

        run: |

          echo "正式フォルダを確認します。"

          mkdir -p assets/pdf
          mkdir -p assets/images/thumbnail

          echo "✅ 正式フォルダを準備しました😊"


      # --------------------------------------
      # PDFを正式フォルダへ移動
      # --------------------------------------

      - name: Move PDF to final location

        run: |

          PDF_PATH="${{ github.event.inputs.pdfPath }}"

          PDF_FILENAME=$(basename "$PDF_PATH")

          FINAL_PDF_PATH="assets/pdf/$PDF_FILENAME"


          echo "PDFを正式フォルダへ移動します。"

          echo "元："
          echo "$PDF_PATH"

          echo ""

          echo "先："
          echo "$FINAL_PDF_PATH"


          cp "$PDF_PATH" "$FINAL_PDF_PATH"


          if [ -f "$FINAL_PDF_PATH" ]; then

            echo ""
            echo "✅ PDFの正式配置に成功しました😊"

          else

            echo ""
            echo "❌ PDFの配置に失敗しました。"
            exit 1

          fi


      # --------------------------------------
      # サムネイルを正式フォルダへ移動
      # --------------------------------------

      - name: Move thumbnail to final location

        run: |

          THUMBNAIL_PATH="${{ github.event.inputs.thumbnailPath }}"

          THUMBNAIL_FILENAME=$(basename "$THUMBNAIL_PATH")

          FINAL_THUMBNAIL_PATH="assets/images/thumbnail/$THUMBNAIL_FILENAME"


          echo "サムネイルを正式フォルダへ移動します。"

          echo "元："
          echo "$THUMBNAIL_PATH"

          echo ""

          echo "先："
          echo "$FINAL_THUMBNAIL_PATH"


          cp "$THUMBNAIL_PATH" "$FINAL_THUMBNAIL_PATH"


          if [ -f "$FINAL_THUMBNAIL_PATH" ]; then

            echo ""
            echo "✅ サムネイルの正式配置に成功しました😊"

          else

            echo ""
            echo "❌ サムネイルの配置に失敗しました。"
            exit 1

          fi


      # --------------------------------------
      # 正式配置されたファイル確認
      # --------------------------------------

      - name: Verify final files

        run: |

          PDF_PATH="${{ github.event.inputs.pdfPath }}"
          THUMBNAIL_PATH="${{ github.event.inputs.thumbnailPath }}"

          PDF_FILENAME=$(basename "$PDF_PATH")
          THUMBNAIL_FILENAME=$(basename "$THUMBNAIL_PATH")

          FINAL_PDF_PATH="assets/pdf/$PDF_FILENAME"
          FINAL_THUMBNAIL_PATH="assets/images/thumbnail/$THUMBNAIL_FILENAME"


          echo "======================================"
          echo "正式配置ファイル確認"
          echo "======================================"

          echo ""
          echo "PDF："
          echo "$FINAL_PDF_PATH"

          ls -lh "$FINAL_PDF_PATH"


          echo ""
          echo "サムネイル："
          echo "$FINAL_THUMBNAIL_PATH"

          ls -lh "$FINAL_THUMBNAIL_PATH"


          echo ""
          echo "======================================"
          echo "✅ 正式配置ファイルを確認しました😊"
          echo "======================================"


      # --------------------------------------
      # works.js更新
      # --------------------------------------

      - name: Update works.js

        env:
          UPLOAD_ID: ${{ github.event.inputs.uploadId }}

        run: |

          echo "======================================"
          echo "works.js自動更新"
          echo "Version 10.1"
          echo "======================================"


          node <<'NODE'

          const fs = require("fs");
          const path = require("path");


          // ----------------------------------
          // ファイルパス
          // ----------------------------------

          const metadataPath =
            `.project-library-upload/metadata/${process.env.UPLOAD_ID}.json`;

          const worksPath =
            "assets/data/works.js";


          console.log("Metadata：");
          console.log(metadataPath);

          console.log("");

          console.log("works.js：");
          console.log(worksPath);


          // ----------------------------------
          // metadata読み込み
          // ----------------------------------

          if (!fs.existsSync(metadataPath)) {

            console.error(
              "❌ metadataファイルが見つかりません。"
            );

            process.exit(1);

          }


          const metadata =
            JSON.parse(
              fs.readFileSync(
                metadataPath,
                "utf8"
              )
            );


          console.log("");
          console.log("作品情報を読み込みました😊");

          console.log(
            `タイトル：${metadata.title}`
          );


          // ----------------------------------
          // works.js読み込み
          // ----------------------------------

          if (!fs.existsSync(worksPath)) {

            console.error(
              "❌ works.jsが見つかりません。"
            );

            process.exit(1);

          }


          const worksText =
            fs.readFileSync(
              worksPath,
              "utf8"
            );


          // ----------------------------------
          // works配列の開始位置
          // ----------------------------------

          const startMarker =
            "const works = [";


          const startIndex =
            worksText.indexOf(
              startMarker
            );


          if (startIndex === -1) {

            console.error(
              "❌ works.jsの開始位置を確認できません。"
            );

            process.exit(1);

          }


          // ----------------------------------
          // 共通関数の開始位置
          // ----------------------------------

          const commonMarker =
            "// --------------------------\n// 共通関数";


          const commonIndex =
            worksText.indexOf(
              commonMarker,
              startIndex
            );


          if (commonIndex === -1) {

            console.error(
              "❌ works.jsの共通関数位置を確認できません。"
            );

            process.exit(1);

          }


          // ----------------------------------
          // works配列の閉じ括弧を取得
          // ----------------------------------
          //
          // 共通関数の直前にある
          // 「];」を探す。
          //
          // 空行の数に影響されない方式。
          //

          const closeIndex =
            worksText.lastIndexOf(
              "];",
              commonIndex
            );


          if (closeIndex === -1) {

            console.error(
              "❌ works配列の終了位置を確認できません。"
            );

            process.exit(1);

          }


          if (
            closeIndex <=
            startIndex
          ) {

            console.error(
              "❌ works配列の位置関係が不正です。"
            );

            process.exit(1);

          }


          // ----------------------------------
          // works配列部分を取得
          // ----------------------------------

          const arrayStart =
            startIndex +
            startMarker.length;


          const arrayText =
            worksText
              .slice(
                arrayStart,
                closeIndex
              )
              .trim();


          console.log("");
          console.log(
            "works配列データを取得しました😊"
          );


          // ----------------------------------
          // 既存works配列をJavaScriptとして取得
          // ----------------------------------

          let works;


          try {

            works =
              Function(
                `"use strict"; return [${arrayText}]`
              )();

          } catch (error) {

            console.error(
              "❌ works.jsの既存データを読み込めませんでした。"
            );

            console.error(error);

            process.exit(1);

          }


          if (!Array.isArray(works)) {

            console.error(
              "❌ worksデータが配列ではありません。"
            );

            process.exit(1);

          }


          console.log(
            `現在の作品数：${works.length}件`
          );


          // ----------------------------------
          // データ変換用関数
          // ----------------------------------

          function toArray(value) {

            if (Array.isArray(value)) {
              return value;
            }

            if (
              value === undefined ||
              value === null ||
              value === ""
            ) {
              return [];
            }

            return String(value)
              .split(/[、,]/)
              .map(item => item.trim())
              .filter(Boolean);

          }


          function toNumber(
            value,
            defaultValue = 0
          ) {

            const number =
              Number(value);

            if (
              Number.isFinite(number)
            ) {
              return number;
            }

            return defaultValue;

          }


          // ----------------------------------
          // ID決定
          // ----------------------------------

          const id =
            toNumber(
              metadata.workId
            );


          if (!id) {

            console.error(
              "❌ workIdが正しくありません。"
            );

            process.exit(1);

          }


          // ----------------------------------
          // workNo決定
          // ----------------------------------

          let workNo =
            String(
              metadata.workNo || ""
            ).trim();


          if (
            !/^PL-\d{6}$/.test(workNo)
          ) {

            workNo =
              `PL-${String(id).padStart(6, "0")}`;

          }


          // ----------------------------------
          // 正式ファイルパス
          // ----------------------------------

          const pdfFilename =
            path.basename(
              metadata.pdfPath
            );


          const thumbnailFilename =
            path.basename(
              metadata.thumbnailPath
            );


          const pdfPath =
            `assets/pdf/${pdfFilename}`;


          const thumbnailPath =
            `assets/images/thumbnail/${thumbnailFilename}`;


          // ----------------------------------
          // works.js用データ作成
          // ----------------------------------

          const newWork = {

            id: id,

            workNo: workNo,

            title:
              metadata.title || "",

            category:
              toArray(
                metadata.category
              ),

            fixedTags:
              toArray(
                metadata.fixedTags
              ),

            freeTags:
              toArray(
                metadata.freeTags
              ),

            series:
              metadata.series || "",

            level:
              toNumber(
                metadata.level,
                1
              ),

            age:
              metadata.age || "",

            size:
              metadata.size || "",

            tools:
              toArray(
                metadata.tools
              ),

            description:
              metadata.description || "",

            thumbnail:
              thumbnailPath,

            pdf:
              pdfPath,

            isNew:
              metadata.isNew !== false,

            recommend:
              metadata.recommend === true,

            publishDate:
              metadata.publishDate || "",

            updateDate:
              metadata.updateDate || "",

            etsy:
              metadata.etsy || "",

            related:
              Array.isArray(
                metadata.related
              )
                ? metadata.related
                : [],

            viewCount:
              0,

            downloadCount:
              0,

            favorite:
              false

          };


          // ----------------------------------
          // 既存作品チェック
          // ----------------------------------

          const existingIndex =
            works.findIndex(
              work =>
                Number(work.id) === id
            );


          if (
            existingIndex !== -1
          ) {

            console.log("");
            console.log(
              `既存作品 id:${id} を更新します。`
            );

            works[existingIndex] =
              newWork;

          } else {

            console.log("");
            console.log(
              `新しい作品 id:${id} を追加します。`
            );

            works.push(
              newWork
            );

          }


          // ----------------------------------
          // ID重複チェック
          // ----------------------------------

          const ids =
            works.map(
              work =>
                Number(work.id)
            );


          const uniqueIds =
            new Set(ids);


          if (
            ids.length !==
            uniqueIds.size
          ) {

            console.error(
              "❌ ID重複が発生しています。"
            );

            process.exit(1);

          }


          // ----------------------------------
          // works.js生成
          // ----------------------------------

          //
          // 既存の共通関数は
          // 「];」から最後までをそのまま使用。
          //

          const commonFunctions =
            worksText.slice(
              closeIndex
            );


          const newWorksText =
            "// ==========================\n" +
            "// Project Library\n" +
            "// works.js\n" +
            "// Version 10.1\n" +
            "// ==========================\n\n" +
            "const works = " +
            JSON.stringify(
              works,
              null,
              4
            ) +
            ";\n\n" +
            commonFunctions;


          fs.writeFileSync(
            worksPath,
            newWorksText,
            "utf8"
          );


          // ----------------------------------
          // 完了ログ
          // ----------------------------------

          console.log("");
          console.log(
            "🎉 works.jsを更新しました！"
          );

          console.log(
            `作品数：${works.length}件`
          );

          console.log(
            `追加/更新ID：${id}`
          );

          console.log(
            `workNo：${workNo}`
          );

          console.log(
            `タイトル：${metadata.title}`
          );

          console.log("");

          console.log(
            "======================================"
          );

          console.log(
            "works.js Version 10.1 完了😊"
          );

          console.log(
            "======================================"
          );


          NODE


      # --------------------------------------
      # works.js更新結果確認
      # --------------------------------------

      - name: Verify works.js

        run: |

          echo "======================================"
          echo "works.js確認"
          echo "======================================"

          grep -n \
            'title' \
            assets/data/works.js \
            | tail -10

          echo ""

          grep -n \
            'workNo' \
            assets/data/works.js \
            | tail -10

          echo ""

          echo "======================================"
          echo "✅ works.jsの更新を確認しました😊"
          echo "======================================"


      # --------------------------------------
      # metadata削除
      # --------------------------------------

      - name: Remove metadata

        run: |

          METADATA_PATH=".project-library-upload/metadata/${{ github.event.inputs.uploadId }}.json"


          echo "metadataを削除します。"

          echo "$METADATA_PATH"


          rm -f "$METADATA_PATH"


          if [ -e "$METADATA_PATH" ]; then

            echo "❌ metadataが残っています。"
            exit 1

          fi


          echo "✅ metadataを削除しました😊"


      # --------------------------------------
      # 一時PDF・サムネイル削除
      # --------------------------------------

      - name: Remove temporary upload files

        run: |

          PDF_PATH="${{ github.event.inputs.pdfPath }}"
          THUMBNAIL_PATH="${{ github.event.inputs.thumbnailPath }}"


          echo "一時ファイルを削除します。"


          rm -f "$PDF_PATH"
          rm -f "$THUMBNAIL_PATH"


          echo "一時ファイル削除後："


          if [ -e "$PDF_PATH" ]; then

            echo "❌ PDF一時ファイルが残っています。"
            exit 1

          fi


          if [ -e "$THUMBNAIL_PATH" ]; then

            echo "❌ サムネイル一時ファイルが残っています。"
            exit 1

          fi


          echo "✅ 一時ファイルを削除しました😊"


      # --------------------------------------
      # Git設定
      # --------------------------------------

      - name: Configure Git

        run: |

          git config user.name "Project Library Bot"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      # --------------------------------------
      # 変更内容確認
      # --------------------------------------

      - name: Show changed files

        run: |

          echo "======================================"
          echo "Git変更内容"
          echo "======================================"

          git status --short

          echo "======================================"


      # --------------------------------------
      # 正式ファイル保存
      # --------------------------------------

      - name: Commit and push published files

        run: |

          git add assets/pdf
          git add assets/images/thumbnail
          git add assets/data/works.js
          git add .project-library-upload


          if git diff --cached --quiet; then

            echo "❌ 保存する変更がありません。"
            exit 1

          fi


          git commit \
            -m "publish: ${{ github.event.inputs.title }}"


          git push


          echo ""
          echo "======================================"
          echo "🎉 Project Library Version 10.1"
          echo "======================================"
          echo "PDF：保存完了"
          echo "サムネイル：保存完了"
          echo "works.js：更新完了"
          echo "metadata：削除完了"
          echo "======================================"
          echo "正式公開ファイルの保存に成功しました！"
          echo "======================================"
