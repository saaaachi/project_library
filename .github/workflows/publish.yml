
# ======================================
# Project Library Publish
# Version 10.4
# ======================================
#
# 追加機能：
# ・category / fixedTags 必須チェック
# ・SEO作品ページ自動生成
# ・sitemap.xml自動更新
# ・SEO生成結果の検証
# ・SEOファイルを同時コミット
#
# 既存機能：
# ・PDF正式配置
# ・サムネイル正式配置
# ・works.js更新
# ・ID自動採番
# ・metadata削除
# ・一時ファイル削除
# ======================================

name: Project Library Publish

on:
  workflow_dispatch:
    inputs:
      title:
        description: '作品タイトル'
        required: true
        type: string

      category:
        description: 'カテゴリ'
        required: true
        type: string

      fixedTags:
        description: '固定タグ'
        required: false
        type: string

      freeTags:
        description: '自由タグ'
        required: false
        type: string

      uploadId:
        description: 'アップロードID'
        required: false
        type: string

      pdfPath:
        description: '一時PDFパス'
        required: false
        type: string

      thumbnailPath:
        description: '一時サムネイルパス'
        required: false
        type: string


concurrency:
  group: project-library-publish
  cancel-in-progress: false


jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # --------------------------------------
      # リポジトリ取得
      # --------------------------------------

      - name: Repository checkout
        uses: actions/checkout@v4
        with:
          ref: main

      # --------------------------------------
      # Node.js準備
      # --------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --------------------------------------
      # 公開情報確認
      # --------------------------------------

      - name: Show publish information
        env:
          TITLE: ${{ inputs.title }}
          CATEGORY: ${{ inputs.category }}
          FIXED_TAGS: ${{ inputs.fixedTags }}
          FREE_TAGS: ${{ inputs.freeTags }}
          UPLOAD_ID: ${{ inputs.uploadId }}
          PDF_PATH: ${{ inputs.pdfPath }}
          THUMBNAIL_PATH: ${{ inputs.thumbnailPath }}

        run: |
          echo "======================================"
          echo "Project Library Publish"
          echo "Version 10.4"
          echo "======================================"
          echo "Title: $TITLE"
          echo "Category: $CATEGORY"
          echo "Fixed Tags: $FIXED_TAGS"
          echo "Free Tags: $FREE_TAGS"
          echo "Upload ID: $UPLOAD_ID"
          echo "PDF Path: $PDF_PATH"
          echo "Thumbnail Path: $THUMBNAIL_PATH"
          echo "======================================"

      # --------------------------------------
      # 一時アップロードファイル確認
      # --------------------------------------

      - name: Check uploaded files
        env:
          UPLOAD_ID: ${{ inputs.uploadId }}
          PDF_PATH: ${{ inputs.pdfPath }}
          THUMBNAIL_PATH: ${{ inputs.thumbnailPath }}

        run: |
          set -e

          echo "アップロードファイルを確認します。"

          if [ -z "$UPLOAD_ID" ]; then
            echo "❌ アップロードIDがありません。"
            exit 1
          fi

          if [ -z "$PDF_PATH" ]; then
            echo "❌ PDFパスがありません。"
            exit 1
          fi

          if [ -z "$THUMBNAIL_PATH" ]; then
            echo "❌ サムネイルパスがありません。"
            exit 1
          fi

          if [ ! -f "$PDF_PATH" ]; then
            echo "❌ PDFファイルが見つかりません。"
            exit 1
          fi

          if [ ! -f "$THUMBNAIL_PATH" ]; then
            echo "❌ サムネイルが見つかりません。"
            exit 1
          fi

          echo "✅ アップロードファイル確認完了"

      # --------------------------------------
      # metadata確認
      # --------------------------------------

      - name: Check metadata
        env:
          UPLOAD_ID: ${{ inputs.uploadId }}

        run: |
          set -e

          METADATA_PATH=".project-library-upload/metadata/${UPLOAD_ID}.json"

          if [ ! -f "$METADATA_PATH" ]; then
            echo "❌ metadataが見つかりません。"
            exit 1
          fi

          echo "metadataを確認しました。"
          echo "$METADATA_PATH"

      # --------------------------------------
      # 正式フォルダ作成
      # --------------------------------------

      - name: Create final directories
        run: |
          mkdir -p assets/pdf
          mkdir -p assets/images/thumbnail
          echo "✅ 正式フォルダ準備完了"

      # --------------------------------------
      # PDF正式配置
      # --------------------------------------

      - name: Move PDF to final location
        env:
          PDF_PATH: ${{ inputs.pdfPath }}

        run: |
          set -e

          PDF_FILENAME=$(basename "$PDF_PATH")
          FINAL_PDF_PATH="assets/pdf/$PDF_FILENAME"

          cp "$PDF_PATH" "$FINAL_PDF_PATH"

          test -f "$FINAL_PDF_PATH"

          echo "✅ PDF配置完了"
          echo "$FINAL_PDF_PATH"

      # --------------------------------------
      # サムネイル正式配置
      # --------------------------------------

      - name: Move thumbnail to final location
        env:
          THUMBNAIL_PATH: ${{ inputs.thumbnailPath }}

        run: |
          set -e

          THUMBNAIL_FILENAME=$(basename "$THUMBNAIL_PATH")
          FINAL_THUMBNAIL_PATH="assets/images/thumbnail/$THUMBNAIL_FILENAME"

          cp "$THUMBNAIL_PATH" "$FINAL_THUMBNAIL_PATH"

          test -f "$FINAL_THUMBNAIL_PATH"

          echo "✅ サムネイル配置完了"
          echo "$FINAL_THUMBNAIL_PATH"

      # --------------------------------------
      # 正式配置ファイル確認
      # --------------------------------------

      - name: Verify final files
        env:
          PDF_PATH: ${{ inputs.pdfPath }}
          THUMBNAIL_PATH: ${{ inputs.thumbnailPath }}

        run: |
          set -e

          FINAL_PDF_PATH="assets/pdf/$(basename "$PDF_PATH")"
          FINAL_THUMBNAIL_PATH="assets/images/thumbnail/$(basename "$THUMBNAIL_PATH")"

          test -f "$FINAL_PDF_PATH"
          test -f "$FINAL_THUMBNAIL_PATH"

          ls -lh "$FINAL_PDF_PATH"
          ls -lh "$FINAL_THUMBNAIL_PATH"

          echo "✅ 正式配置ファイル確認完了"

      # --------------------------------------
      # works.js更新
      # Version 10.4
      # --------------------------------------

      - name: Update works.js
        env:
          UPLOAD_ID: ${{ inputs.uploadId }}

        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const metadataPath =
            `.project-library-upload/metadata/${process.env.UPLOAD_ID}.json`;

          const worksPath = "assets/data/works.js";

          if (!fs.existsSync(metadataPath)) {
            console.error("❌ metadataがありません。");
            process.exit(1);
          }

          if (!fs.existsSync(worksPath)) {
            console.error("❌ works.jsがありません。");
            process.exit(1);
          }

          const metadata = JSON.parse(
            fs.readFileSync(metadataPath, "utf8")
          );

          const worksText = fs.readFileSync(
            worksPath,
            "utf8"
          );

          // ----------------------------------
          // works配列を取得
          // ----------------------------------

          const startMarker = "const works = [";

          const endMarker =
            "// --------------------------\n// 共通関数";

          const startIndex = worksText.indexOf(startMarker);
          const endIndex = worksText.indexOf(endMarker);

          if (
            startIndex === -1 ||
            endIndex === -1 ||
            endIndex <= startIndex
          ) {
            console.error("❌ works.jsの構造を確認できません。");
            process.exit(1);
          }

          const arrayStart =
            startIndex + startMarker.length;

          let arrayText = worksText
            .slice(arrayStart, endIndex)
            .trim();

          arrayText = arrayText
            .replace(/\]\s*;\s*$/, "")
            .trim();

          let works;

          try {
            works = Function(
              `"use strict"; return [${arrayText}]`
            )();
          } catch (error) {
            console.error("❌ works配列の解析に失敗しました。");
            console.error(error);
            process.exit(1);
          }

          if (!Array.isArray(works)) {
            console.error("❌ worksが配列ではありません。");
            process.exit(1);
          }

          // ----------------------------------
          // データ変換関数
          // ----------------------------------

          function toArray(value) {
            if (Array.isArray(value)) {
              return value
                .map(item => String(item).trim())
                .filter(Boolean);
            }

            if (
              value === undefined ||
              value === null ||
              value === ""
            ) {
              return [];
            }

            const text = String(value).trim();

            if (
              text.startsWith("[") &&
              text.endsWith("]")
            ) {
              try {
                const parsed = JSON.parse(text);

                if (Array.isArray(parsed)) {
                  return parsed
                    .map(item => String(item).trim())
                    .filter(Boolean);
                }
              } catch (error) {
                console.log(
                  "JSON配列ではないため通常の文字列として処理します。"
                );
              }
            }

            return text
              .split(/[、,]/)
              .map(item => item.trim())
              .filter(Boolean);
          }

          function toNumber(value, defaultValue = 0) {
            const number = Number(value);

            return Number.isFinite(number)
              ? number
              : defaultValue;
          }

          // ----------------------------------
          // 必須カテゴリ確認
          // ----------------------------------

          const category = toArray(metadata.category);
          const fixedTags = toArray(metadata.fixedTags);
          const freeTags = toArray(metadata.freeTags);
          const series = toArray(metadata.series);

          if (category.length === 0) {
            console.error(
              "❌ 大カテゴリ（category）は最低1つ必要です。"
            );
            process.exit(1);
          }

          if (fixedTags.length === 0) {
            console.error(
              "❌ 小カテゴリ（fixedTags）は最低1つ必要です。"
            );
            process.exit(1);
          }

          console.log("category:", category);
          console.log("fixedTags:", fixedTags);
          console.log("freeTags:", freeTags);

          // ----------------------------------
          // ID決定
          // ----------------------------------

          let id = toNumber(metadata.workId);
          const isNewWork = !id;

          if (isNewWork) {
            const numericIds = works
              .map(work => Number(work.id))
              .filter(value =>
                Number.isFinite(value) && value > 0
              );

            const maxId = numericIds.length
              ? Math.max(...numericIds)
              : 0;

            id = maxId + 1;

            console.log(`新規作品ID：${id}`);
          } else {
            console.log(`既存作品ID：${id}`);
          }

          // ----------------------------------
          // workNo決定
          // ----------------------------------

          let workNo = String(
            metadata.workNo || ""
          ).trim();

          if (!/^PL-\d{6}$/.test(workNo)) {
            workNo =
              `PL-${String(id).padStart(6, "0")}`;
          }

          // ----------------------------------
          // 正式ファイルパス
          // ----------------------------------

          const pdfFilename = path.basename(
            metadata.pdfPath
          );

          const thumbnailFilename = path.basename(
            metadata.thumbnailPath
          );

          const pdfPath =
            `assets/pdf/${pdfFilename}`;

          const thumbnailPath =
            `assets/images/thumbnail/${thumbnailFilename}`;

          // ----------------------------------
          // works.js用データ作成
          // ----------------------------------

          const newWork = {
            id: id,

            workNo: workNo,

            title: metadata.title || "",

            category: category,

            fixedTags: fixedTags,

            freeTags: freeTags,

            series: series,

            level: toNumber(metadata.level, 1),

            age: metadata.age || "",

            size: metadata.size || "",

            tools: toArray(metadata.tools),

            description: metadata.description || "",

            thumbnail: thumbnailPath,

            pdf: pdfPath,

            isNew: metadata.isNew !== false,

            recommend: metadata.recommend === true,

            publishDate: metadata.publishDate || "",

            updateDate: metadata.updateDate || "",

            etsy: metadata.etsy || "",

            related: Array.isArray(metadata.related)
              ? metadata.related
              : [],

            viewCount: 0,

            downloadCount: 0,

            favorite: false
          };

          // ----------------------------------
          // 既存作品更新・新規追加
          // ----------------------------------

          const existingIndex = works.findIndex(
            work => Number(work.id) === id
          );

          if (existingIndex !== -1) {
            console.log(`既存作品 ${id} を更新します。`);
            works[existingIndex] = newWork;
          } else {
            console.log(`新規作品 ${id} を追加します。`);
            works.push(newWork);
          }

          // ----------------------------------
          // ID重複チェック
          // ----------------------------------

          const ids = works.map(
            work => Number(work.id)
          );

          if (ids.length !== new Set(ids).size) {
            console.error("❌ IDが重複しています。");
            process.exit(1);
          }

          // ----------------------------------
          // works.js書き込み
          // ----------------------------------

          const commonFunctions =
            worksText.slice(endIndex);

          const newWorksText =
            "// ==========================\n" +
            "// Project Library\n" +
            "// works.js\n" +
            "// Version 10.4\n" +
            "// ==========================\n\n" +
            "const works = " +
            JSON.stringify(works, null, 4) +
            ";\n\n" +
            commonFunctions;

          fs.writeFileSync(
            worksPath,
            newWorksText,
            "utf8"
          );

          console.log("======================================");
          console.log("✅ works.js更新完了");
          console.log(`作品数：${works.length}`);
          console.log(`作品ID：${id}`);
          console.log(`workNo：${workNo}`);
          console.log("======================================");
          NODE

      # --------------------------------------
      # works.js更新確認
      # --------------------------------------

      - name: Verify works.js
        run: |
          set -e

          test -f assets/data/works.js

          grep -n 'title' assets/data/works.js | tail -10
          grep -n 'workNo' assets/data/works.js | tail -10

          echo "✅ works.js確認完了"

      # --------------------------------------
      # SEO Generator構文確認
      # --------------------------------------

      - name: Check SEO Generator
        run: |
          set -e

          test -f tools/generate-seo.js

          node --check tools/generate-seo.js

          echo "✅ SEO Generator構文確認完了"

      # --------------------------------------
      # SEOページ・サイトマップ生成
      # --------------------------------------

      - name: Generate SEO pages and sitemap
        run: |
          set -e

          echo "======================================"
          echo "SEOページ自動生成"
          echo "======================================"

          node tools/generate-seo.js

          echo "✅ SEO生成処理完了"

      # --------------------------------------
      # SEO生成結果確認
      # --------------------------------------

      - name: Verify SEO output
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          works_dir = Path("works")
          sitemap_path = Path("sitemap.xml")

          pages = sorted(works_dir.glob("*.html"))

          if not pages:
              sys.exit("❌ SEO作品ページがありません。")

          if not sitemap_path.is_file():
              sys.exit("❌ sitemap.xmlがありません。")

          sitemap = sitemap_path.read_text(
              encoding="utf-8"
          )

          urls = re.findall(
              r"<loc>\s*([^<]+)\s*</loc>",
              sitemap
          )

          for page in pages:
              html = page.read_text(
                  encoding="utf-8"
              )

              if 'rel="canonical"' not in html:
                  sys.exit(
                      f"❌ canonicalがありません: {page}"
                  )

              if 'id="workArea"' not in html:
                  sys.exit(
                      f"❌ workAreaがありません: {page}"
                  )

              expected_url = (
                  "https://saaaachi.github.io/"
                  "project_library/works/"
                  + page.name
              )

              if expected_url not in urls:
                  sys.exit(
                      f"❌ sitemapにURLがありません: {page}"
                  )

          print("======================================")
          print("✅ SEO生成結果確認完了")
          print(f"作品ページ数：{len(pages)}")
          print(f"サイトマップURL数：{len(urls)}")
          print("======================================")
          PY

      # --------------------------------------
      # metadata削除
      # --------------------------------------

      - name: Remove metadata
        env:
          UPLOAD_ID: ${{ inputs.uploadId }}

        run: |
          set -e

          METADATA_PATH=".project-library-upload/metadata/${UPLOAD_ID}.json"

          rm -f "$METADATA_PATH"

          if [ -e "$METADATA_PATH" ]; then
            echo "❌ metadataが残っています。"
            exit 1
          fi

          echo "✅ metadata削除完了"

      # --------------------------------------
      # 一時ファイル削除
      # --------------------------------------

      - name: Remove temporary upload files
        env:
          PDF_PATH: ${{ inputs.pdfPath }}
          THUMBNAIL_PATH: ${{ inputs.thumbnailPath }}

        run: |
          set -e

          rm -f "$PDF_PATH"
          rm -f "$THUMBNAIL_PATH"

          if [ -e "$PDF_PATH" ]; then
            echo "❌ 一時PDFが残っています。"
            exit 1
          fi

          if [ -e "$THUMBNAIL_PATH" ]; then
            echo "❌ 一時サムネイルが残っています。"
            exit 1
          fi

          echo "✅ 一時ファイル削除完了"

      # --------------------------------------
      # Git設定
      # --------------------------------------

      - name: Configure Git
        run: |
          git config user.name "Project Library Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # --------------------------------------
      # 変更内容確認
      # --------------------------------------

      - name: Show changed files
        run: |
          echo "======================================"
          echo "Git変更内容"
          echo "======================================"

          git status --short

          echo "======================================"

      # --------------------------------------
      # 正式ファイルとSEOファイル保存
      # --------------------------------------

      - name: Commit and push published files
        env:
          WORK_TITLE: ${{ inputs.title }}

        run: |
          set -e

          # 既存の保存対象
          git add -A assets/pdf
          git add -A assets/images/thumbnail
          git add assets/data/works.js
          git add -A .project-library-upload

          # Version 10.4 追加
          # -Aで削除済みSEOページも反映
          git add -A works/
          git add sitemap.xml

          if git diff --cached --quiet; then
            echo "❌ 保存する変更がありません。"
            exit 1
          fi

          git commit -m "publish: ${WORK_TITLE}"

          git push origin HEAD:main

          echo ""
          echo "======================================"
          echo "🎉 Project Library Publish"
          echo "Version 10.4"
          echo "======================================"
          echo "PDF：保存完了"
          echo "サムネイル：保存完了"
          echo "works.js：更新完了"
          echo "metadata：削除完了"
          echo "SEO作品ページ：更新完了"
          echo "sitemap.xml：更新完了"
          echo "======================================"
