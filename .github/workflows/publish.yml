name: Project Library Publish

on:
  workflow_dispatch:
    inputs:
      title:
        description: '作品タイトル'
        required: true
        type: string

      category:
        description: 'カテゴリ'
        required: true
        type: string

      fixedTags:
        description: '固定タグ'
        required: false
        type: string

      freeTags:
        description: '自由タグ'
        required: false
        type: string


jobs:
  publish:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Repository checkout
        uses: actions/checkout@v4


      - name: Create publish test file
        run: |
          mkdir -p .project-library-test

          cat > .project-library-test/latest.txt << EOF
          Project Library Publish Test

          Title: ${{ github.event.inputs.title }}
          Category: ${{ github.event.inputs.category }}
          Fixed Tags: ${{ github.event.inputs.fixedTags }}
          Free Tags: ${{ github.event.inputs.freeTags }}

          Published at:
          $(date '+%Y-%m-%d %H:%M:%S')

          GitHub Actions automatic commit is working.
          EOF


      - name: Commit test file
        run: |
          git config user.name "Project Library Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .project-library-test/latest.txt

          git diff --cached --quiet || git commit -m "test: Project Library automatic publish"

          git push