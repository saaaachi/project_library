
# ======================================
# Project Library
# SEO Generator Test Workflow
# Version 1.1
# ======================================

name: Project Library SEO Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-seo:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------
      # リポジトリ取得
      # ----------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------
      # Node.js設定
      # ----------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ----------------------------------
      # JavaScript構文確認
      # ----------------------------------

      - name: Check JavaScript syntax
        run: node --check tools/generate-seo.js

      # ----------------------------------
      # SEOファイル生成
      # ----------------------------------

      - name: Generate SEO files
        run: node tools/generate-seo.js

      # ----------------------------------
      # 生成結果の検証
      # ----------------------------------

      - name: Validate generated files
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          pages = sorted(
              Path("works").glob("*.html")
          )

          assert len(pages) == 38, (
              f"作品HTML数が想定と違います: {len(pages)}"
          )

          for page in pages:
              content = page.read_text(
                  encoding="utf-8"
              )

              for marker in [
                  "<title>",
                  'rel="canonical"',
                  'property="og:image"',
                  "<h1",
                  'href="../assets/pdf/'
              ]:
                  assert marker in content, (
                      f"{page} に {marker} がありません"
                  )

          tree = ET.parse("sitemap.xml")
          root = tree.getroot()

          namespace = {
              "s": "http://www.sitemaps.org/schemas/sitemap/0.9"
          }

          urls = [
              element.text
              for element in root.findall(
                  ".//s:loc",
                  namespace
              )
          ]

          assert len(urls) == 40, (
              f"URL数が想定と違います: {len(urls)}"
          )

          assert len(urls) == len(set(urls)), (
              "サイトマップに重複URLがあります"
          )

          for page in pages:
              expected = (
                  "https://saaaachi.github.io/"
                  "project_library/works/"
                  + page.name
              )

              assert expected in urls, (
                  f"サイトマップに {expected} がありません"
              )

          print("作品HTML：38件 OK")
          print("サイトマップ：40件 OK")
          print("SEO基本タグ：OK")
          print("重複URL：なし")
          print("SEOテスト成功！")
          PY

      # ----------------------------------
      # テスト成果物の保存
      # ----------------------------------

      - name: Upload SEO test files
        uses: actions/upload-artifact@v4
        with:
          name: project-library-seo-test
          path: |
            works/
            sitemap.xml
          retention-days: 7

# ======================================
# テスト専用
#
# ・本番公開しない
# ・mainへ自動pushしない
# ・投稿機能は変更しない
# ・削除機能は変更しない
# ======================================
