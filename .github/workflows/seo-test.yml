
# ======================================
# Project Library
# SEO Generator Test Workflow
# Version 1.2
# ======================================

name: Project Library SEO Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-seo:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------
      # リポジトリ取得
      # ----------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------
      # Node.js設定
      # ----------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ----------------------------------
      # JavaScript構文確認
      # ----------------------------------

      - name: Check JavaScript syntax
        run: |
          node --check tools/generate-seo.js
          node --check assets/js/work.js

      # ----------------------------------
      # SEOファイル生成
      # ----------------------------------

      - name: Generate SEO files
        run: node tools/generate-seo.js

      # ----------------------------------
      # HTML・サイトマップ検証
      # ----------------------------------

      - name: Validate SEO files
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path(".")
          pages = sorted(
              (root / "works").glob("*.html")
          )

          assert pages, (
              "SEO作品HTMLが生成されていません"
          )

          required_files = [
              "assets/data/works.js",
              "assets/js/common.js",
              "assets/js/work.js",
              "assets/css/style.css"
          ]

          for file in required_files:
              assert (root / file).is_file(), (
                  f"必要なファイルがありません: {file}"
              )

          required_html = [
              'rel="canonical"',
              'property="og:title"',
              'property="og:description"',
              'property="og:image"',
              '<h1',
              'id="workArea"',
              'id="pdfDownloadButton"',
              'id="pdfDownloadHelp"',
              'id="seriesArea"',
              'id="relatedArea"',
              'id="moveArea"',
              'id="header"',
              'id="sidebar"',
              'id="footer"',
              'data-project-library-tag=',
              '../assets/data/works.js',
              '../assets/js/common.js',
              '../assets/js/work.js'
          ]

          for page in pages:
              content = page.read_text(
                  encoding="utf-8"
              )

              for marker in required_html:
                  assert marker in content, (
                      f"{page}: {marker} がありません"
                  )

              assert content.count(
                  'class="work-ad-100"'
              ) == 2, (
                  f"{page}: 広告枠が2つではありません"
              )

              assert content.count(
                  'id="pdfDownloadButton"'
              ) == 1, (
                  f"{page}: PDFボタンが重複しています"
              )

              assert content.count(
                  "<h1"
              ) == 1, (
                  f"{page}: h1が重複しています"
              )

          tree = ET.parse(
              root / "sitemap.xml"
          )

          namespace = {
              "s":
              "http://www.sitemaps.org/schemas/sitemap/0.9"
          }

          urls = [
              element.text
              for element in tree.findall(
                  ".//s:loc",
                  namespace
              )
          ]

          expected_count = len(pages) + 2

          assert len(urls) == expected_count, (
              f"URL数が不一致: {len(urls)}"
              f" / 期待値: {expected_count}"
          )

          assert len(urls) == len(set(urls)), (
              "サイトマップにURL重複があります"
          )

          for page in pages:
              expected_url = (
                  "https://saaaachi.github.io/"
                  "project_library/works/"
                  + page.name
              )

              assert expected_url in urls, (
                  f"サイトマップに未登録: {page.name}"
              )

          print("==============================")
          print("Project Library SEO Test")
          print("Version 1.2")
          print("==============================")
          print(f"作品HTML: {len(pages)}件 OK")
          print(f"サイトマップ: {len(urls)}件 OK")
          print("SEO基本タグ: OK")
          print("JavaScript読み込み: OK")
          print("PDFボタン: OK")
          print("広告枠: OK")
          print("シリーズ・関連作品領域: OK")
          print("共通レイアウト領域: OK")
          print("URL重複: なし")
          print("==============================")
          print("SEOテスト成功！")
          PY

      # ----------------------------------
      # テスト成果物を保存
      # ----------------------------------

      - name: Upload SEO test files
        uses: actions/upload-artifact@v4
        with:
          name: project-library-seo-test
          path: |
            works/
            sitemap.xml
          retention-days: 7

# ======================================
# テスト専用
#
# ・本番公開しない
# ・mainへ自動pushしない
# ・publish.ymlは変更しない
# ・delete.ymlは変更しない
# ======================================
